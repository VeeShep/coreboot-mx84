# Physically verified on the MX84: front receptacle and internal Phison.
FRONT_USB_PATH=1-1.2
INTERNAL_USB_PATHS=1-1.1
MANAGEMENT_INTERFACE=mgmt0
PFSENSE_DOMAIN=pfsense
PFSENSE_COMMISSIONED=/var/lib/mx84-platform/pfsense-commissioned
PFREST_CONFIG=/etc/mx84/pfrest.conf
CRITICAL_SERVICES=mx84-switch.service
REQUIRED_BRIDGES=br-wan1,br-wan2,br-lan1,br-lan2,br-lan3,br-lan4,br-lan5,br-lan6,br-lan7,br-lan8,br-sfp1,br-sfp2,br-pfctl
BOOT_RAINBOW_SECONDS=90
PFSENSE_START_GRACE_SECONDS=180
API_CHECK_SECONDS=5
USB_ACTIVITY_HOLD_SECONDS=1.5
